name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pyarrow
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: the study reproduces
        run: python -m csid all
      - name: the reported numbers are the numbers in the repository
        run: python tests/test_reproducible.py

  clean-venv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the wheel and install it into an empty environment
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl pyarrow
          /tmp/fresh/bin/python -c "import csid, sys; print('csid', csid.__version__, sys.version)"
