[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-sid"
version = "0.1.0"
description = "Learning contact physics from a robot's own force data, and measuring which half of that promise holds"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yangyi Zhang", email = "yangyizhang031117@163.com" }]
keywords = ["system-identification", "contact-dynamics", "robot-learning", "sparse-regression", "identifiability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.24", "pyarrow>=14"]

[project.urls]
Homepage = "https://github.com/ZhangYangyi03/contact-sid"
Source = "https://github.com/ZhangYangyi03/contact-sid"

[project.scripts]
contact-sid = "csid.__main__:main"

[tool.setuptools]
packages = ["csid"]

[tool.setuptools.package-data]
csid = ["../data/ur5/*.parquet", "../data/ur5/*.json", "../data/ur5/*.md"]
